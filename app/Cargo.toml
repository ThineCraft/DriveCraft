[package]
name = "drivecraft-app"
version = "0.1.0"
edition = "2021"
description = "DriveCraft desktop app"
license = "MIT"
publish = false

[[bin]]
name = "drivecraft-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
drivecraft = { path = ".." }
tauri = { version = "2", features = ["tray-icon"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
rfd = "0.18"
open = "5"
notify = "8"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
