[package]
name = "drivecraft"
version = "0.1.0"
edition = "2024"
description = "Open-source synchronization client for SharePoint, OneDrive for work, and ShareCraft"
repository = "https://github.com/ThineCraft/DriveCraft"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
flate2 = "1.1.11"
futures-util = "0.3.34"
getrandom = "0.4.3"
if-addrs = "0.15.0"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "http2", "json", "query", "rustls", "stream", "system-proxy"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "net", "io-util", "time", "sync", "signal"] }
url = "2.5.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading"] }

[workspace]
members = [".", "app"]
